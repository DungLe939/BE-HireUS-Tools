openapi: 3.0.3
info:
  title: Voice Mock Interview API
  version: 0.8.0
  description: |
    Configuration, device-confirmed start, text interview, speech drafts/playback, evaluation, recovery and history.
    FR-VMI-01, FR-VMI-02, FR-VMI-04, FR-VMI-05, FR-VMI-06, FR-VMI-10,
    FR-VMI-11..20, FR-VMI-23, FR-VMI-27, FR-VMI-28 and NFR-VMI-03.
    Creation stores a SETUP session and a CV snapshot without calling AI.
    Start initializes AI using that snapshot. AI failure preserves SETUP and
    all saved data so that the owner can retry the same start endpoint.
    Storage is temporary and is lost on server restart.
    Authentication is temporary: only NODE_ENV=test honors x-mock-user-id;
    every other environment uses the fixed mock identity. JWT is not implemented.
paths:
  /vmi/sessions/{id}/transcribe:
    post:
      operationId: transcribeVmiAnswer
      summary: Return speech draft for confirmation (FR-VMI-12, FR-VMI-13).
      description: |
        Owner only, IN_PROGRESS with a current unanswered question and no pending
        next-question generation. Language comes only from the session.
        One file named audio, no text fields. Supported MIME: audio/webm, audio/ogg,
        audio/wav, audio/x-wav, audio/mpeg, audio/mp3, audio/mp4, audio/m4a, audio/x-m4a.
        MIME parameters are normalized by multipart; ASR checks the decoded container.
        Hard upload cap 15728640 bytes (15 MiB), configurable downwards through
        VMI_AUDIO_MAX_BYTES. Default decoded duration limit 195000 ms (180s + 15s
        margin), configurable via VMI_AUDIO_MAX_DURATION_MS in 180000..600000.
        Audio and text are not saved. The client must confirm/edit text then call
        POST /answers separately. All failures preserve the saved interview data.
        Concurrent transcription for one session returns 400; retry is safe.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [audio]
              properties:
                audio: { type: string, format: binary }
      responses:
        '200':
          description: Nonempty draft only. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [text, language]
                properties:
                  text: { type: string, minLength: 1 }
                  language:
                    $ref: '#/components/schemas/Language'
        '400':
          description: Missing/empty audio, invalid UUID, unexpected fields/files, invalid state, or transcription already running.
        '404':
          description: Missing session or foreign owner.
        '413':
          description: Audio exceeds configured upload limit (hard cap 15 MiB).
        '415':
          description: VMI_STT_UNSUPPORTED_AUDIO; unsupported MIME or invalid/mismatched container.
        '422':
          description: VMI_STT_AUDIO_TOO_LONG or VMI_STT_EMPTY_TRANSCRIPT.
        '502':
          description: VMI_STT_UNAVAILABLE; rejected upstream request or malformed JSON/result.
        '503':
          description: VMI_STT_UNAVAILABLE; invalid config, upstream overload, or network failure.
        '504':
          description: VMI_STT_TIMEOUT; request or body read exceeded timeout.
  /vmi/sessions/{id}/questions/{questionId}/audio:
    get:
      operationId: getVmiQuestionAudio
      summary: Read or replay a saved question in the session language (FR-VMI-11).
      description: |
        Owner only. Session must be SETUP or IN_PROGRESS and questionId must belong
        to its saved turns. SETUP currently has no generated questions, so returns
        404 until start succeeds. No saved text, answer or status is changed.
        WAV PCM 16-bit mono 44100 Hz from self-hosted ZONOS3-Mini.
        Failures preserve the question text and allow retry. Concurrent requests
        for the same question share one generation; audio is not persisted/cached.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Buffered WAV. Cache-Control is no-store.
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '400':
          description: Invalid UUID or session not SETUP/IN_PROGRESS.
        '404':
          description: Session absent, foreign owner, or question absent from this session.
        '502':
          description: VMI_TTS_UNAVAILABLE; upstream rejected request, malformed/empty WAV, or unexpected failure.
        '503':
          description: VMI_TTS_UNAVAILABLE; invalid config, network error or upstream overload.
        '504':
          description: VMI_TTS_TIMEOUT; request or response body timed out.
  /vmi/options:
    get:
      operationId: getVmiOptions
      summary: List supported interview settings (FR-VMI-01, FR-VMI-02).
      parameters:
        - $ref: '#/components/parameters/TestUserId'
      responses:
        '200':
          description: Available settings and question-count bounds.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [positions, levels, languages, targetQuestionCount]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                  levels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Level'
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'
                  targetQuestionCount:
                    type: object
                    additionalProperties: false
                    required: [min, max, default]
                    properties:
                      min:
                        type: integer
                        enum: [5]
                      max:
                        type: integer
                        enum: [8]
                      default:
                        type: integer
                        enum: [6]
  /vmi/sessions:
    get:
      operationId: listVmiSessions
      summary: List the owner's interview history (FR-VMI-21, FR-VMI-22, U005).
      description: |
        Include only non-SETUP sessions with at least one non-blank saved answer.
        Exclude all zero-answer sessions, including ENDED, EVALUATED and REPORT_FAILED.
        Apply ownership and eligibility filters BEFORE counting and pagination.
        Sort by createdAt DESC, then id ASC for equal timestamps.
        Pagination uses limit (default 20, maximum 50) and offset (default 0).
        Query values must be canonical unsigned decimal integers without leading zeros;
        empty, fractional, negative, repeated, non-numeric or unknown parameters return 400.
        Optional overallScore/band are present only when a report exists; overallScore
        uses the same response rounding as /report. No placeholder zero score is added.
        Summaries do not contain CV, transcript, userId, internal context or AI state.
        In-memory history is lost when the server restarts.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
      responses:
        '200':
          description: Filtered page with total eligible records for the owner.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistorySessionSummary'
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 50
                  offset:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createVmiSession
      summary: Create a SETUP session with optional CV (FR-VMI-04, FR-VMI-06, FR-VMI-23).
      description: |
        Defaults to six questions. No AI request is made here.
        If cvId is supplied, fetch the owner's CV and preserve a detached snapshot.
        EmptyCvProvider currently returns 404 for every supplied cvId.
        Internal context, question plans, userId and CV contents are not exposed.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Saved configuration, ready for the device check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The supplied CV does not exist or is not available to this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /vmi/sessions/{id}:
    get:
      operationId: getVmiSessionDetails
      summary: Read the owner's saved session, CV snapshot, transcript and report (FR-VMI-21..23).
      description: |
        Missing and foreign sessions both return 404. Detail access is available
        for every owned session, including SETUP and zero-answer sessions omitted
        from the history list. Read cvSnapshot from the session only; never refetch
        CV data. Editing or deleting the original CV cannot change this response.
        Omit context, questionPlan, userId, lastAiError, pendingNextQuestion and
        all other internal state. A report is omitted until one has been saved.
        To interview again with these settings, the frontend sends position, level,
        language, targetQuestionCount and optional cvId to POST /vmi/sessions.
        There is no replay endpoint; creating a new session resolves the current CV
        normally and does not change this historical snapshot.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Public session detail, with the CV snapshot used for that session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /vmi/sessions/{id}/start:
    post:
      operationId: startVmiSession
      summary: Confirm device readiness and initialize AI (FR-VMI-05, FR-VMI-10).
      description: |
        Only the owner may start a SETUP session. Missing and foreign sessions both
        return 404. Concurrent or repeated starts return 409. The saved CV snapshot
        is used even if the original CV was edited after creation.
        Successful initialization stores the opening turn, sets askedAt/startedAt,
        and transitions to IN_PROGRESS. Failure keeps SETUP, its snapshot and turns
        unchanged (FR-VMI-27); retry with the same request after the failure.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Version 4 UUID returned when creating the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceReady]
              properties:
                deviceReady:
                  type: boolean
                  enum: [true]
      responses:
        '200':
          description: Started session and its first question.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status, startedAt, question]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [IN_PROGRESS]
                  startedAt:
                    type: string
                    format: date-time
                  question:
                    $ref: '#/components/schemas/OpeningQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Session missing or owned by another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '409':
          description: Session is not in SETUP or another start request is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '502':
          description: AI initialization failed. Code VMI_AI_ERROR; retry start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiError'
        '503':
          description: AI unavailable. Code VMI_AI_UNAVAILABLE; retry start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiError'
        '504':
          description: AI timeout. Code VMI_AI_TIMEOUT; retry start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiError'
  /vmi/sessions/{id}/answers:
    post:
      operationId: submitVmiAnswer
      summary: Submit confirmed text and generate the next question (FR-VMI-14, FR-VMI-15).
      description: |
        Owner only. Requires IN_PROGRESS, no pending next question, and the current
        unanswered questionId. Saves the answer before calling AI. elapsedSeconds
        is measured from askedAt; strictly over 180 seconds sets timedOut=true
        while still accepting the answer. A full interview has 5-8 questions:
        one OPENING, 3-6 TECHNICAL, one CLOSING. The final answer changes the
        session to ENDED and returns completed=true for the client evaluation step.
        AI failure preserves the answer and pendingNextQuestion=true (FR-VMI-27).
        Duplicate/stale answers and concurrent mutations return 409.
        Internal context and questionPlan are never included in responses.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [questionId, answerText]
              properties:
                questionId:
                  type: string
                  format: uuid
                answerText:
                  type: string
                  minLength: 1
                  maxLength: 20000
                  pattern: '\S'
      responses:
        '200':
          description: Saved answer and next question, or completed interview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionConflict'
        '502':
          $ref: '#/components/responses/NextQuestionFailed'
        '503':
          $ref: '#/components/responses/NextQuestionFailed'
        '504':
          $ref: '#/components/responses/NextQuestionFailed'
  /vmi/sessions/{id}/finish:
    post:
      operationId: finishVmiSession
      summary: End an IN_PROGRESS interview early (FR-VMI-16).
      description: |
        Owner only. Preserves all turns, sets ENDED and clears pendingNextQuestion.
        Allowed with zero answers and while next-question generation is pending.
        A late AI response cannot add a question or reopen an ended session.
        Evaluation is a separate step; an empty transcript cannot be evaluated.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Ended interview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status, completed, endedAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [ENDED]
                  completed:
                    type: boolean
                    enum: [true]
                  endedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionConflict'
  /vmi/sessions/{id}/evaluate:
    post:
      operationId: evaluateVmiSession
      summary: Evaluate the complete transcript of an ENDED interview (FR-VMI-17..20).
      description: |
        Owner only. Requires ENDED and at least one answered question. Does not run
        automatically when the final answer is submitted. Concurrent evaluations,
        EVALUATED and REPORT_FAILED return 409. Recover a REPORT_FAILED session
        through POST /vmi/sessions/{id}/report/retry; /evaluate remains ENDED-only.
        AI returns only the three component scores (0-100) and narrative feedback.
        Backend computes technical*0.5 + problemSolving*0.3 + communication*0.2.
        Classify using the unrounded score: RED <50, YELLOW [50,75), GREEN >=75.
        Store the unrounded total; round overallScore to two decimals only in API
        responses. Labels are not probabilities of hiring. No color hex is returned.
        AI failure preserves every turn, saves REPORT_FAILED and no report/zero score.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Persisted evaluation and full transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionConflict'
        '422':
          description: No answered questions; insufficient evaluation data. Session remains ENDED with no report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '502':
          $ref: '#/components/responses/ReportFailed'
        '503':
          $ref: '#/components/responses/ReportFailed'
        '504':
          $ref: '#/components/responses/ReportFailed'
  /vmi/sessions/{id}/report:
    get:
      operationId: getVmiReport
      summary: Read the owner's stored report and complete transcript.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Existing report, without regenerating it or calling AI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Session missing, foreign, or report not yet available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
  /vmi/sessions/{id}/next-question/retry:
    post:
      operationId: retryVmiNextQuestion
      summary: Recover next-question generation from saved answers (FR-VMI-27).
      description: |
        Owner only. Requires IN_PROGRESS, pendingNextQuestion=true, and saved
        answers for all existing turns. Reuses the saved context, CV snapshot,
        questionPlan and transcript without accepting or resubmitting an answer.
        Only one generation may run at a time, including generation initiated
        by /answers. A concurrent request returns 409 without calling AI.
        Success adds exactly one question and clears pendingNextQuestion/lastAiError.
        Repeated requests after success return 409 and cannot add another question.
        A recovered CLOSING question still awaits its answer, like /answers.
        If all target questions already have answers, finish with completed=true
        and ENDED without calling AI or adding any question beyond the target.
        A late AI result cannot reopen a session ended by /finish.
        On AI error, keep every saved turn and pendingNextQuestion=true; retry is safe.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Recovered question or already answered final turn; acceptedAnswer describes the last saved answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionConflict'
        '502':
          $ref: '#/components/responses/NextQuestionFailed'
        '503':
          $ref: '#/components/responses/NextQuestionFailed'
        '504':
          $ref: '#/components/responses/NextQuestionFailed'
  /vmi/sessions/{id}/report/retry:
    post:
      operationId: retryVmiReport
      summary: Regenerate a failed report from the preserved transcript (FR-VMI-28, NFR-VMI-04).
      description: |
        Owner only. Requires REPORT_FAILED and at least one saved answer.
        Uses exactly the same evaluation, score calculation, classification,
        response rounding and disclaimer logic as /evaluate. No new interview
        or answers are needed. /evaluate continues to accept ENDED only.
        Success sets EVALUATED and clears lastAiError. Concurrent retry requests
        and repeated requests after success return 409 without another AI call.
        A next-question generation still in flight after /finish also blocks
        report retry until it settles; recovery operations for one session do not overlap.
        On error remain REPORT_FAILED, preserving the complete transcript and
        saving no report or placeholder zero score. No request body is required.
      parameters:
        - $ref: '#/components/parameters/TestUserId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Recovered report and unchanged full transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionConflict'
        '422':
          description: Insufficient saved answer data; no report is generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '502':
          $ref: '#/components/responses/ReportFailed'
        '503':
          $ref: '#/components/responses/ReportFailed'
        '504':
          $ref: '#/components/responses/ReportFailed'
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session UUID v4.
    TestUserId:
      name: x-mock-user-id
      in: header
      required: false
      description: Test identity override; ignored outside NODE_ENV=test. Omitted/blank uses the fixed mock identity.
      schema:
        type: string
  responses:
    ReportFailed:
      description: |
        AI failure (502), unavailable (503), or timeout (504).
        Session is REPORT_FAILED; transcript remains intact and no report is saved.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/HttpError'
              - type: object
                required: [code, sessionStatus]
                properties:
                  code:
                    type: string
                    enum: [VMI_REPORT_ERROR, VMI_REPORT_UNAVAILABLE, VMI_REPORT_TIMEOUT]
                  sessionStatus:
                    type: string
                    enum: [REPORT_FAILED]
    SessionNotFound:
      description: Session missing or owned by another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    SessionConflict:
      description: Invalid session/question state, pending question, or concurrent mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    NextQuestionFailed:
      description: |
        AI error (502), unavailable (503), or timeout (504). The answer is saved;
        session remains IN_PROGRESS with pendingNextQuestion=true. Do not resubmit
        the answer. The owner may retry POST /vmi/sessions/{id}/next-question/retry
        or finish the session.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/HttpError'
              - type: object
                required: [code, pendingNextQuestion]
                properties:
                  code:
                    type: string
                    enum: [VMI_NEXT_QUESTION_ERROR, VMI_NEXT_QUESTION_UNAVAILABLE, VMI_NEXT_QUESTION_TIMEOUT]
                  pendingNextQuestion:
                    type: boolean
                    enum: [true]
    BadRequest:
      description: Invalid DTO, unexpected property, invalid UUID, or deviceReady not exactly true.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
  schemas:
    HistorySessionSummary:
      type: object
      additionalProperties: false
      required: [id, createdAt, position, level, language, status]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        position:
          $ref: '#/components/schemas/Position'
        level:
          $ref: '#/components/schemas/Level'
        language:
          $ref: '#/components/schemas/Language'
        status:
          type: string
          enum: [IN_PROGRESS, ENDED, EVALUATED, REPORT_FAILED]
        overallScore:
          type: number
          minimum: 0
          maximum: 100
        band:
          type: string
          enum: [RED, YELLOW, GREEN]
    SessionDetails:
      type: object
      additionalProperties: false
      required: [id, position, level, language, status, targetQuestionCount, createdAt, updatedAt, transcript]
      properties:
        id:
          type: string
          format: uuid
        position:
          $ref: '#/components/schemas/Position'
        level:
          $ref: '#/components/schemas/Level'
        language:
          $ref: '#/components/schemas/Language'
        status:
          type: string
          enum: [SETUP, IN_PROGRESS, ENDED, EVALUATED, REPORT_FAILED]
        targetQuestionCount:
          type: integer
          minimum: 5
          maximum: 8
        cvId:
          type: string
        cvSnapshot:
          type: object
          additionalProperties: false
          required: [id, summary]
          properties:
            id:
              type: string
            summary:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptTurn'
        report:
          $ref: '#/components/schemas/Report'
    ReportResult:
      type: object
      additionalProperties: false
      required: [id, status, language, transcript, report]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [EVALUATED]
        language:
          $ref: '#/components/schemas/Language'
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptTurn'
        report:
          $ref: '#/components/schemas/Report'
    TranscriptTurn:
      type: object
      additionalProperties: false
      required: [questionId, questionText, stage, askedAt]
      properties:
        questionId:
          type: string
          format: uuid
        questionText:
          type: string
        stage:
          type: string
          enum: [OPENING, TECHNICAL, CLOSING]
        askedAt:
          type: string
          format: date-time
        answerText:
          type: string
        answeredAt:
          type: string
          format: date-time
        elapsedSeconds:
          type: number
          minimum: 0
        timedOut:
          type: boolean
    Report:
      type: object
      additionalProperties: false
      required: [technical, problemSolving, communication, overallScore, band, strengths, knowledgeGaps, suggestedAnswers, reviewTopics, recommendation, disclaimer, createdAt]
      properties:
        technical:
          type: number
          minimum: 0
          maximum: 100
        problemSolving:
          type: number
          minimum: 0
          maximum: 100
        communication:
          type: number
          minimum: 0
          maximum: 100
        overallScore:
          type: number
          minimum: 0
          maximum: 100
          description: Rounded to two decimal places for display; band uses the unrounded total.
        band:
          type: string
          enum: [RED, YELLOW, GREEN]
        strengths:
          type: array
          items:
            type: string
        knowledgeGaps:
          type: array
          items:
            type: string
        suggestedAnswers:
          type: array
          items:
            type: string
        reviewTopics:
          type: array
          items:
            type: string
        recommendation:
          type: string
        disclaimer:
          type: string
          description: Localized training-only disclaimer, explicitly not a hiring probability.
        createdAt:
          type: string
          format: date-time
    InterviewQuestion:
      type: object
      additionalProperties: false
      required: [questionId, questionText, stage, askedAt]
      properties:
        questionId:
          type: string
          format: uuid
        questionText:
          type: string
        stage:
          type: string
          enum: [OPENING, TECHNICAL, CLOSING]
        askedAt:
          type: string
          format: date-time
    AnswerResult:
      type: object
      additionalProperties: false
      required: [id, status, completed, acceptedAnswer]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS, ENDED]
        completed:
          type: boolean
        acceptedAnswer:
          type: object
          additionalProperties: false
          required: [questionId, elapsedSeconds, timedOut]
          properties:
            questionId:
              type: string
              format: uuid
            elapsedSeconds:
              type: number
              minimum: 0
            timedOut:
              type: boolean
        question:
          $ref: '#/components/schemas/InterviewQuestion'
    Position:
      type: string
      enum: [FRONTEND, BACKEND, FULLSTACK, MOBILE, AI_DATA]
    Level:
      type: string
      enum: [INTERN, FRESHER]
    Language:
      type: string
      enum: [vi, en]
    CreateSession:
      type: object
      additionalProperties: false
      required: [position, level, language]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        level:
          $ref: '#/components/schemas/Level'
        language:
          $ref: '#/components/schemas/Language'
        cvId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^\S+$'
        targetQuestionCount:
          type: integer
          minimum: 5
          maximum: 8
          default: 6
    SetupSession:
      type: object
      additionalProperties: false
      required: [id, position, level, language, status, targetQuestionCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        position:
          $ref: '#/components/schemas/Position'
        level:
          $ref: '#/components/schemas/Level'
        language:
          $ref: '#/components/schemas/Language'
        status:
          type: string
          enum: [SETUP]
        targetQuestionCount:
          type: integer
          minimum: 5
          maximum: 8
        cvId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OpeningQuestion:
      type: object
      additionalProperties: false
      required: [questionId, questionText, stage, askedAt]
      properties:
        questionId:
          type: string
          format: uuid
        questionText:
          type: string
        stage:
          type: string
          enum: [OPENING]
        askedAt:
          type: string
          format: date-time
    HttpError:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    AiError:
      allOf:
        - $ref: '#/components/schemas/HttpError'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [VMI_AI_ERROR, VMI_AI_UNAVAILABLE, VMI_AI_TIMEOUT]
